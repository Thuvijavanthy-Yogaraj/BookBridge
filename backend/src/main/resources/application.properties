spring.application.name=backend
server.port=8080

# MySQL connection. The "bookbridge" database is created automatically if it doesn't exist.
spring.datasource.url=jdbc:mysql://localhost:3306/bookbridge?createDatabaseIfNotExist=true
spring.datasource.username=root

# The password is kept in backend/secret.properties, which is not uploaded to GitHub.
spring.config.import=optional:file:./secret.properties

# Create and update the tables from the classes in the model package
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false